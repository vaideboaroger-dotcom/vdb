<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--c1:#2563eb;--c2:#1e40af;--c3:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-touch-callout:none;font-family:'Inter','Rajdhani',sans-serif;-webkit-font-smoothing:antialiased}
input,textarea{user-select:text!important;-webkit-user-select:text!important}
button{touch-action:manipulation;font-family:inherit;cursor:pointer}
html,body{height:100%;width:100%;background:#000;overflow:hidden;position:fixed;top:0;left:0}

#loading{position:fixed;inset:0;background:linear-gradient(135deg,var(--c2),var(--c1));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:99999}
#loading img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#loading h1{font-family:'Audiowide';font-size:1.6rem;color:#fff;letter-spacing:6px}
#loading p{color:rgba(255,255,255,.8);letter-spacing:6px;font-size:.7rem;font-weight:800}
.loadbar{width:220px;height:5px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden}
.loadbar div{height:100%;width:0%;background:#fff;transition:width .3s;border-radius:5px}

#app{position:fixed;inset:0;display:none;flex-direction:column;background:#000}
#app.on{display:flex}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#000}
#bg video,#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
#bg .on{opacity:1;z-index:2}

#topo{position:relative;z-index:30;padding:calc(10px + var(--st)) 16px 12px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);display:flex;flex-direction:column;gap:8px}
.linha-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;height:36px}
.timer{font-size:.78rem;font-weight:800;color:#fff;min-width:76px}
.logo{font-family:'Audiowide';font-size:1.25rem;font-weight:900;letter-spacing:6px;color:#fff;text-align:center;flex:1;text-shadow:0 0 16px var(--c3);cursor:pointer}
.btn-mini{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:36px;height:36px;color:#fff;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.letreiro{display:flex;align-items:center;gap:10px;height:38px;overflow:hidden;cursor:pointer}
.letreiro i{color:#fff;opacity:.85;flex-shrink:0}
.letreiro p{font-size:1rem;font-weight:800;color:#fff;white-space:nowrap;animation:scroll 70s linear infinite;flex:1;overflow:hidden}
@keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}

#meio{flex:1;position:relative;z-index:1}

#player{position:relative;z-index:20;padding:18px 20px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.5) 40%,rgba(0,0,0,.85));display:flex;flex-direction:column;gap:12px;text-align:center}
.coracao{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:50%;width:44px;height:44px;color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;margin:0 auto}
.coracao.on{color:#f472b6;background:rgba(244,114,182,.25);border-color:#f472b6}
.label{font-size:.65rem;font-weight:800;letter-spacing:4px;color:rgba(255,255,255,.7);text-transform:uppercase}
.nome{font-family:'Rajdhani';font-size:1.6rem;font-weight:800;color:#fff;line-height:1.15;word-break:break-word}
.artista{font-size:.9rem;font-weight:600;color:rgba(255,255,255,.85)}
.controles{display:flex;justify-content:center;align-items:center;gap:32px;margin-top:4px}
.btn-play{background:transparent;border:none;color:#fff;font-size:1.7rem;padding:8px}
.btn-play.big{font-size:2.1rem}
.btn-play:active{transform:scale(.85)}
.progresso{margin-top:6px}
.tempos{display:flex;justify-content:space-between;font-size:.7rem;font-weight:700;color:rgba(255,255,255,.85);margin-bottom:6px}
.barra{height:5px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden;cursor:pointer}
.barra div{height:100%;width:0%;background:#fff;border-radius:5px;transition:width .2s linear}

#acoes{position:relative;z-index:25;padding:0 12px calc(10px + var(--sb));background:rgba(0,0,0,.85);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px}
.acao{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.62rem;font-weight:800;text-transform:uppercase;min-height:62px;justify-content:center}
.acao i{font-size:1.3rem}
.acao:active{transform:scale(.94);background:rgba(255,255,255,.14)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:rgba(15,15,25,.98);border-radius:28px 28px 0 0;width:100%;padding:20px 18px calc(20px + var(--sb));border-top:1px solid rgba(255,255,255,.15);max-height:88vh;overflow-y:auto;animation:up .35s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sheet-header h2{font-family:'Audiowide';font-size:1.1rem;color:#fff;letter-spacing:3px}
.sheet-close{background:rgba(255,255,255,.08);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1rem}

.opc{width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:8px}
.opc:active{background:rgba(255,255,255,.12)}
.opc i{width:24px;text-align:center;font-size:1rem;color:var(--c3)}

.gen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:16px}
.gen{position:relative;min-height:96px;border-radius:18px;padding:16px 14px 14px 20px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1.5px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden;text-align:left;width:100%}
.gen::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:60%;background:var(--gc,#22d3ee);border-radius:0 5px 5px 0;box-shadow:0 0 12px var(--gc,#22d3ee)}
.gen:active{transform:scale(.95)}
.gen-nome{font-family:'Rajdhani';font-size:1.2rem;font-weight:800;color:#fff;text-transform:uppercase;position:relative;z-index:2}
.gen-qtd{font-size:.68rem;color:rgba(255,255,255,.55);font-weight:700;margin-top:4px;position:relative;z-index:2}
.gen.ok::after{content:'✓';position:absolute;top:8px;right:10px;background:#10b981;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900}

#notif{position:fixed;top:calc(90px + var(--st));left:50%;transform:translateX(-50%);background:rgba(15,15,20,.97);color:#fff;padding:11px 20px;border-radius:22px;font-size:.82rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(255,255,255,.15);font-weight:700}
#notif.on{opacity:1}

#loadOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:center;justify-content:center;color:#fff;font-size:2rem}
#loadOverlay.on{display:flex}
#loadOverlay i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#block{position:fixed;inset:0;background:rgba(0,0,0,.98);z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#block.on{display:flex}
#block img{width:80px;border-radius:50%;margin-bottom:12px}
#block h1{font-family:'Audiowide';color:#fff;font-size:2rem;letter-spacing:6px;margin-bottom:6px}
#block p{color:rgba(255,255,255,.7);margin-bottom:18px;letter-spacing:2px;font-weight:700}
#block input{width:100%;max-width:380px;padding:16px;border-radius:30px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:1rem;text-align:center;margin-bottom:12px;outline:none}
#block .ok{width:100%;max-width:380px;padding:16px;background:linear-gradient(135deg,var(--c1),var(--c3));border:none;border-radius:30px;color:#fff;font-weight:900;font-size:1rem}
#block .zap{background:#25d366;border:none;padding:14px;border-radius:30px;color:#fff;font-weight:900;font-size:.9rem;width:100%;max-width:380px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
#block .err{color:#ec4899;font-size:.82rem;min-height:28px;font-weight:700;margin-top:8px}
#block .fp{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);padding:10px;border-radius:12px;margin-top:12px;max-width:380px;width:100%}
#block .fp span{font-size:.6rem;color:rgba(255,255,255,.6);font-family:monospace;word-break:break-all;flex:1;text-align:left}
#block .fp button{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 12px;border-radius:10px;font-size:.65rem;font-weight:700}

/* ═══════ BOTÃO INSTALAR APP ═══════ */
#btnInstalar{
  position:fixed;
  bottom:calc(90px + var(--sb));
  right:16px;
  z-index:9998;
  background:linear-gradient(135deg,var(--c1),var(--c3));

/* MODAL INSTRUÇÕES */
#modalInstalar{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:100003;display:none;align-items:center;justify-content:center;padding:20px}
#modalInstalar.on{display:flex}
.instalar-box{background:#111;border-radius:26px;padding:26px 22px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,.15);text-align:center}
.instalar-box h3{color:#fff;margin-bottom:18px;font-family:'Audiowide';letter-spacing:3px;font-size:1.15rem}

.passo .num{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.88rem;flex-shrink:0}

#fecharInstalar{background:linear-gradient(135deg,var(--c1),var(--c3));border:none;padding:15px;border-radius:28px;color:#fff;font-weight:900;font-size:.92rem;cursor:pointer;width:100%;margin-top:14px;letter-spacing:2px}
</style>
</head>

<script>
(function(){
'use strict';

const CONFIG = {
  WHATSAPP: '5512988461978',
  SALT: 'vdb_music_2024_x9k7',
  HASH_MASTER: '6c62070b5f5d14e73e27214df05fdda0773523a189eb619c8dcde6de2fbb1631',
  TEMPO_TESTE: 86400,
  VERSION: 'v65',
  LOADING_MS: 2500
};

const TEMAS = {
  azul:{n:'Azul',c1:'#2563eb',c2:'#1e40af',c3:'#3b82f6'},
  roxo:{n:'Roxo',c1:'#7c3aed',c2:'#5b21b6',c3:'#a855f7'},
  verde:{n:'Verde',c1:'#059669',c2:'#065f46',c3:'#10b981'},
  rosa:{n:'Rosa',c1:'#db2777',c2:'#9d174d',c3:'#ec4899'}
};

const URLS = {
  'BÔNUS':'https://raw.githubusercontent.com/radiolojasjc-hub/play12/refs/heads/main/play.json',
  'FLASHBACK':'https://raw.githubusercontent.com/radiolojasjc-hub/flashbacktop/refs/heads/main/flashback.json',
  'RELIGIOSA':'https://raw.githubusercontent.com/radiolojasjc-hub/religiosa/refs/heads/main/religiosa.json',
  'ROMÂNTICA':'https://raw.githubusercontent.com/radiolojasjc-hub/romanticatop/refs/heads/main/romantica.json',
  'MPB':'https://raw.githubusercontent.com/radiolojasjc-hub/mpbtop/refs/heads/main/mpb.json',
  'POP/MIX':'https://raw.githubusercontent.com/radiolojasjc-hub/poptop/refs/heads/main/pop.json',
  'SERTANEJO':'https://raw.githubusercontent.com/radiolojasjc-hub/sertanejo/refs/heads/main/sertanejo.json',
  'FORRÓ':'https://raw.githubusercontent.com/radiolojasjc-hub/forrodez/refs/heads/main/forrodez.json'
};

const ORDEM = ['BÔNUS','POP/MIX','MPB','FORRÓ','SERTANEJO','ROMÂNTICA','FLASHBACK','RELIGIOSA'];

const $ = id => document.getElementById(id);
const now = () => Date.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtT = s => { if(!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60),sg=Math.floor(s%60); return m+':'+(sg<10?'0':'')+sg; };
const vib = (p=15) => { try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };
const san = t => { if(!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.textContent; };

async function sha256(t){
  const b = new TextEncoder().encode(t);
  const h = await crypto.subtle.digest('SHA-256', b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('');
}

let notifTimer = null;
function notif(msg, dur = 2000){
  const el = $('notif');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.classList.remove('on'), dur);
}

const state = {
  musicas: [],
  playlist: [],
  indice: 0,
  tocando: false,
  genero: 'BÔNUS',
  favs: [],
  recentes: new Set(),
  playerAtivo: false,
  carregando: false,
  cacheGeneros: new Map()
};

function shuffle(arr){
  if(!arr||!arr.length) return [];
  const x = [...arr];
  for(let i=x.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}

async function carregarGenero(g){
  if(state.cacheGeneros.has(g)) return state.cacheGeneros.get(g);
  const mem = 'vdb_pl_' + CONFIG.VERSION + '_' + g;
  try{
    const r = await fetch(URLS[g] + '?v=' + CONFIG.VERSION + '&t=' + now(), {signal: AbortSignal.timeout(8000)});
    if(r.ok){
      let j = await r.json();
      if(!Array.isArray(j)) j = j.musicas || j.data || [];
      const ms = (j||[]).filter(m => m && m.src && m.title).map(m => ({
        ...m,
        id: 'm_' + (m.title + '_' + (m.artist||'')).toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,60),
        genero: g,
        artist: m.artist || 'Artista'
      }));
      if(ms.length){
        try{ localStorage.setItem(mem, JSON.stringify(ms)); }catch(e){}
        state.cacheGeneros.set(g, ms);
        return ms;
      }
    }
  }catch(e){}
  try{ const c = localStorage.getItem(mem); if(c){ const p = JSON.parse(c); state.cacheGeneros.set(g, p); return p; } }catch(e){}
  return null;
}

function getUrls(m){
  const s = m.src || '';
  if(!s) return [];
  if(s.startsWith('http')) return [s + (s.includes('?')?'&':'?') + 'v=' + CONFIG.VERSION];
  const n = s.replace(/^\.\//,'').replace(/[^a-zA-Z0-9\-_.]/g,'');
  const repo = 'radiolojasjc-hub/play12';
  return ['https://raw.githubusercontent.com/' + repo + '/refs/heads/main/' + n + '?v=' + CONFIG.VERSION];
}

async function tocar(){
  if(!state.playerAtivo || state.carregando || !state.playlist.length) return;
  state.carregando = true;
  const a = $('audio');
  $('loadOverlay').classList.add('on');
  try{
    $('btnPlay').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const m = state.playlist[state.indice];
    if(!m){ state.carregando = false; $('loadOverlay').classList.remove('on'); return; }
    
    $('nome').textContent = san(m.title);
    $('artista').textContent = san(m.artist);
    $('scroll').innerHTML = '🎵 <b>' + san(m.title) + '</b> — ' + san(m.artist) + ' • VDB MUSIC';
    
    try{ a.pause(); }catch(e){}
    const urls = getUrls(m).slice(0, 3);
    let ok = false;
    for(const u of urls){
      try{
        const car = await new Promise(r => {
          const t = setTimeout(() => { a.oncanplay = null; a.onerror = null; r(false); }, 8000);
          a.oncanplay = () => { clearTimeout(t); a.oncanplay = null; a.onerror = null; r(true); };
          a.onerror = () => { clearTimeout(t); a.oncanplay = null; a.onerror = null; r(false); };
          a.src = u;
          a.load();
        });
        if(car){ ok = true; break; }
      }catch(e){}
    }
    
    if(ok){
      try{
        a.volume = 0;
        await a.play();
        let v = 0;
        const iv = setInterval(() => {
          v += 0.1;
          if(v >= 1){ a.volume = 1; clearInterval(iv); }
          else a.volume = v;
        }, 40);
        state.tocando = true;
        $('btnPlay').innerHTML = '<i class="fas fa-pause"></i>';
      }catch(e){
        $('btnPlay').innerHTML = '<i class="fas fa-play"></i>';
        setTimeout(prox, 500);
      }
    }else{
      $('btnPlay').innerHTML = '<i class="fas fa-play"></i>';
      setTimeout(prox, 500);
    }
  }catch(e){ console.error(e); }
  finally{
    state.carregando = false;
    $('loadOverlay').classList.remove('on');
  }
}

function togglePlay(){
  vib(10);
  const a = $('audio');
  if(!state.playerAtivo) return;
  if(a.paused) tocar();
  else{
    a.pause();
    state.tocando = false;
    $('btnPlay').innerHTML = '<i class="fas fa-play"></i>';
  }
}

function prox(){
  vib(10);
  if(state.carregando || !state.playlist.length) return;
  state.indice = (state.indice + 1) % state.playlist.length;
  tocar();
}

function prev(){
  vib(10);
  if(state.carregando || !state.playlist.length) return;
  state.indice = (state.indice - 1 + state.playlist.length) % state.playlist.length;
  tocar();
}

function atualizarCoracao(){
  const m = state.playlist[state.indice];
  if(!m){ $('btnFav').classList.remove('on'); $('btnFav').innerHTML = '<i class="far fa-heart"></i>'; return; }
  const e = state.favs.some(f => f.id === m.id);
  if(e){ $('btnFav').classList.add('on'); $('btnFav').innerHTML = '<i class="fas fa-heart"></i>'; }
  else{ $('btnFav').classList.remove('on'); $('btnFav').innerHTML = '<i class="far fa-heart"></i>'; }
}

function toggleFav(){
  vib(20);
  const m = state.playlist[state.indice];
  if(!m) return;
  const i = state.favs.findIndex(f => f.id === m.id);
  if(i > -1){ state.favs.splice(i,1); notif('💔 Removida'); }
  else{ state.favs.push({id:m.id, title:m.title, artist:m.artist}); notif('❤️ Adicionada'); }
  atualizarCoracao();
}

function renderGeneros(){
  const grid = $('genGrid');
  grid.innerHTML = '';
  ORDEM.forEach(g => {
    const cores = ['#22d3ee','#60a5fa','#2dd4bf','#fbbf24','#f472b6','#a855f7','#34d399','#8b5cf6'];
    const cor = cores[ORDEM.indexOf(g) % cores.length];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gen';
    b.style.setProperty('--gc', cor);
    b.innerHTML = '<div class="gen-nome">' + g + '</div>';
    b.onclick = () => escolherGenero(g);
    grid.appendChild(b);
  });
}

async function escolherGenero(g){
  vib(15);
  $('loadOverlay').classList.add('on');
  const m = await carregarGenero(g);
  if(!m || !m.length){ $('loadOverlay').classList.remove('on'); notif('❌ Erro ' + g); return; }
  const a = $('audio');
  a.pause();
  state.tocando = false;
  state.musicas = m;
  state.genero = g;
  state.playlist = shuffle(m);
  state.indice = 0;
  $('lbl').textContent = '🎵 ' + g;
  $('loadOverlay').classList.remove('on');
  fecharModal('mGen');
  setTimeout(tocar, 200);
  notif('🎵 ' + g);
}

function abrirModal(id){
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('on'));
  $(id).classList.add('on');
  vib(10);
}
function fecharModal(id){ $(id).classList.remove('on'); }

async function checarLiberado(){
  if(localStorage.getItem('vdb_perm') === 'true') return true;
  const exp = parseInt(localStorage.getItem('vdb_exp') || '0');
  if(!exp){
    const e = now() + CONFIG.TEMPO_TESTE * 1000;
    localStorage.setItem('vdb_exp', String(e));
    return true;
  }
  if(now() > exp) return false;
  return true;
}

async function validarSenha(s){
  if(!s) return false;
  const h = await sha256(CONFIG.SALT + s);
  return h === CONFIG.HASH_MASTER;
}

async function liberar(){
  const s = $('senha').value.trim();
  if(!s){ $('err').textContent = '⚠️ Digite a senha'; return; }
  if(await validarSenha(s)){
    localStorage.setItem('vdb_perm', 'true');
    $('block').classList.remove('on');
    $('err').textContent = '';
    iniciarApp();
  }else{
    $('err').textContent = '❌ Senha inválida!';
    vib([50,30,50]);
  }
}

async function iniciarApp(){
  state.playerAtivo = true;
  
  /* Audio silencioso */
  try{
    const sr = 44100;
    const buf = new ArrayBuffer(44 + sr*2);
    const v = new DataView(buf);
    const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+sr*2,true); w(8,'WAVE'); w(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true);
    v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,sr*2,true);
    const url = URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
    $('bgAudio').src = url;
    $('bgAudio').loop = true;
    $('bgAudio').volume = 0.001;
    await $('bgAudio').play();
  }catch(e){}
  
  /* Fullscreen */
  try{
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  
  /* Carrega primeiro gênero */
  const m = await carregarGenero('BÔNUS');
  if(m && m.length){
    state.musicas = m;
    state.playlist = shuffle(m);
    state.indice = 0;
    if(state.playlist[0]){
      $('nome').textContent = san(state.playlist[0].title);
      $('artista').textContent = san(state.playlist[0].artist);
      atualizarCoracao();
    }
  }
  
  renderGeneros();
  setTimeout(tocar, 500);
  
  /* ⭐ MOSTRA O BOTÃO INSTALAR */
  setTimeout(verificarInstalacao, 3000);
}

/* ═══════ INSTALAR APP ═══════ */
let promptInstalar = null;

function jaInstalado(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

function ehMobile(){
  return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
}

function ehIOS(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function verificarInstalacao(){
  const btn = $('btnInstalar');
  if(!btn) return;
  if(jaInstalado()){ btn.classList.remove('on'); return; }
  if(!ehMobile()){ btn.classList.remove('on'); return; }
  btn.classList.add('on');
}

function abrirInstrucoes(){
  const m = $('modalInstalar');
  if(!m) return;
  if(ehIOS()){
    $('instTitulo').textContent = '📲 INSTALAR NO IPHONE';
    $('inst1').innerHTML = 'Toque em <b>Compartilhar</b>';
    $('inst2').innerHTML = 'Toque em <b>"Adicionar à Tela"</b>';
    $('inst3').innerHTML = 'Confirme com <b>"Adicionar"</b> ✅';
  }else{
    $('instTitulo').textContent = '📲 INSTALAR NO ANDROID';
    $('inst1').innerHTML = 'Toque nos <b>3 pontinhos ⋮</b>';
    $('inst2').innerHTML = 'Toque em <b>"Instalar app"</b>';
    $('inst3').innerHTML = 'Confirme e pronto! 🎵';
  }
  m.classList.add('on');
}

function fecharInstrucoes(){
  const m = $('modalInstalar');
  if(m) m.classList.remove('on');
}

async function clicarInstalar(){
  vib(15);
  if(promptInstalar){
    try{
      promptInstalar.prompt();
      const r = await promptInstalar.userChoice;
      if(r.outcome === 'accepted'){
        notif('🎉 Instalando!');
        $('btnInstalar').classList.remove('on');
      }
      promptInstalar = null;
    }catch(e){
      abrirInstrucoes();
    }
  }else{
    abrirInstrucoes();
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  promptInstalar = e;
  console.log('✅ PWA pronto para instalar');
  setTimeout(verificarInstalacao, 500);
});

window.addEventListener('appinstalled', () => {
  console.log('🎉 App instalado!');
  notif('🎉 App instalado!', 3000);
  $('btnInstalar').classList.remove('on');
  fecharInstrucoes();
});

/* Service Worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(() => console.log('✅ SW registrado'))
      .catch(err => console.warn('⚠️ SW erro:', err));
  });
}

/* ═══════ EVENTOS ═══════ */
function bindEventos(){
  $('btnPlay').onclick = togglePlay;
  $('btnNext').onclick = prox;
  $('btnPrev').onclick = prev;
  $('btnFav').onclick = toggleFav;
  
  const a = $('audio');
  a.ontimeupdate = () => {
    if(a.duration){
      $('fill').style.width = (a.currentTime/a.duration*100) + '%';
      $('tAtual').textContent = fmtT(a.currentTime);
      $('tTotal').textContent = fmtT(a.duration);
    }
  };
  a.onended = () => { if(!state.carregando) setTimeout(prox, 250); };
  a.onerror = () => { if(!state.carregando && a.src) setTimeout(prox, 700); };
  
  const seek = e => {
    if(!a.duration) return;
    const t = e.touches ? e.touches[0] : e;
    const r = $('barra').getBoundingClientRect();
    a.currentTime = Math.max(0, Math.min(1, (t.clientX - r.left)/r.width)) * a.duration;
  };
  $('barra').addEventListener('click', seek);
  
  $('acGen').onclick = () => { renderGeneros(); abrirModal('mGen'); };
  $('acBusca').onclick = () => notif('🔍 Em breve');
  $('acFav').onclick = () => notif('❤️ ' + state.favs.length + ' favoritas');
  $('acOpc').onclick = () => abrirModal('mOpc');
  
  document.querySelectorAll('.sheet-close').forEach(b => {
    b.onclick = () => fecharModal(b.dataset.close);
  });
  document.querySelectorAll('.modal').forEach(m => {
    m.onclick = e => { if(e.target === m) m.classList.remove('on'); };
  });
  
  $('btnMenu').onclick = () => abrirModal('mOpc');
  
  $('opcInstalar').onclick = () => { fecharModal('mOpc'); clicarInstalar(); };
  $('opcFull').onclick = () => {
    fecharModal('mOpc');
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  };
  $('opcShare').onclick = () => {
    fecharModal('mOpc');
    if(navigator.share) navigator.share({title:'VDB MUSIC', url:location.href});
    else { navigator.clipboard.writeText(location.href); notif('📋 Link copiado!'); }
  };
  $('opcReload').onclick = () => location.reload();
  
  /* BOTÃO INSTALAR */
  $('btnInstalar').onclick = clicarInstalar;
  $('fecharInstalar').onclick = fecharInstrucoes;
  $('modalInstalar').onclick = e => { if(e.target === $('modalInstalar')) fecharInstrucoes(); };
  
  $('btnOk').onclick = liberar;
  $('senha').onkeydown = e => { if(e.key === 'Enter') liberar(); };
  $('btnZap').onclick = () => {
    const fp = btoa((navigator.userAgent||'').slice(0,50)).slice(0,24);
    const m = encodeURIComponent('🔑 Olá! Quero liberar o VDB MUSIC.\n\n🆔 ID: ' + fp);
    window.open('https://wa.me/' + CONFIG.WHATSAPP + '?text=' + m, '_blank');
  };
  $('btnFp').onclick = () => {
    const fp = btoa((navigator.userAgent||'').slice(0,50)).slice(0,24);
    navigator.clipboard.writeText(fp);
    notif('📋 ID copiado');
  };
  
  const fp = btoa((navigator.userAgent||'').slice(0,50)).slice(0,24);
  $('fp').textContent = '🆔 ' + fp;
  
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === ' '){ e.preventDefault(); togglePlay(); }
    if(e.key === 'ArrowRight') prox();
    if(e.key === 'ArrowLeft') prev();
  });
  
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      const a = $('audio');
      if(state.tocando && a.paused && a.src && !state.carregando){
        a.play().catch(()=>{});
      }
    }
  });
}

async function boot(){
  /* Favoritos */
  try{ const s = localStorage.getItem('vdb_favs'); if(s) state.favs = JSON.parse(s); }catch(e){}
  
  bindEventos();
  
  let p = 0;
  const pg = setInterval(() => { p += 12; $('loadbar').style.width = Math.min(p, 100) + '%'; if(p >= 100) clearInterval(pg); }, 200);
  
  const lib = await checarLiberado();
  await sleep(CONFIG.LOADING_MS);
  
  $('loading').style.display = 'none';
  $('app').classList.add('on');
  
  if(lib){
    iniciarApp();
  }else{
    $('block').classList.add('on');
  }
}

boot();
})();
