<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banner VDB - 1080x1920</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial Black',Arial,sans-serif}

  html,body{
    width:100%;height:100%;
    background:#1a1a1a;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  /* 📐 Área do banner 1080x1920 (escalada pra caber na tela) */
  .banner{
    width:1080px;
    height:1920px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 25% 15%, rgba(168,85,247,.55), transparent 50%),
      radial-gradient(circle at 75% 85%, rgba(34,211,238,.5), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(244,114,182,.3), transparent 60%),
      linear-gradient(160deg,#0a0616 0%,#1a0a2e 40%,#2a0a3e 70%,#0a0616 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:100px 70px 80px;
    color:#fff;
    text-align:center;
    transform:scale(0.42);
    transform-origin:center center;
    box-shadow:0 0 100px rgba(168,85,247,.3);
  }

  /* ✨ Partículas de fundo */
  .banner::before{
    content:'';
    position:absolute;
    inset:-30%;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.15) 2px, transparent 3px),
      radial-gradient(circle, rgba(168,85,247,.25) 1.5px, transparent 2.5px),
      radial-gradient(circle, rgba(34,211,238,.2) 1px, transparent 2px);
    background-size:120px 120px, 180px 180px, 90px 90px;
    background-position:0 0, 60px 60px, 30px 30px;
    animation:particulas 30s linear infinite;
    pointer-events:none;
  }
  @keyframes particulas{
    0%{transform:translate(0,0) rotate(0deg)}
    100%{transform:translate(120px,120px) rotate(360deg)}
  }

  /* 🌟 Anel de luz girando */
  .banner::after{
    content:'';
    position:absolute;
    width:1400px;
    height:1400px;
    top:-400px;
    left:50%;
    margin-left:-700px;
    border-radius:50%;
    background:conic-gradient(
      from 0deg,
      transparent,
      rgba(168,85,247,.25),
      transparent 30%,
      rgba(34,211,238,.25),
      transparent 60%,
      rgba(244,114,182,.2),
      transparent
    );
    animation:anelGirando 15s linear infinite;
    filter:blur(80px);
    pointer-events:none;
  }
  @keyframes anelGirando{
    0%{transform:rotate(0)}
    100%{transform:rotate(360deg)}
  }

  /* 🎯 Conteúdo em cima do fundo */
  .conteudo{
    position:relative;
    z-index:5;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:40px;
  }

  /* 🎵 Logo circular */
  .logo-wrapper{
    position:relative;
    width:340px;
    height:340px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
  }
  .logo-wrapper::before{
    content:'';
    position:absolute;
    inset:-25px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(168,85,247,.6), transparent 70%);
    animation:haloPulse 3s ease-in-out infinite;
  }
  .logo-wrapper::after{
    content:'';
    position:absolute;
    inset:-15px;
    border-radius:50%;
    border:6px solid transparent;
    border-top-color:#a855f7;
    border-right-color:#22d3ee;
    border-bottom-color:#f472b6;
    border-left-color:#fbbf24;
    animation:spin 6s linear infinite;
    box-shadow:0 0 60px rgba(168,85,247,.8);
  }
  @keyframes haloPulse{
    0%,100%{transform:scale(1);opacity:.7}
    50%{transform:scale(1.15);opacity:1}
  }
  @keyframes spin{
    0%{transform:rotate(0)}
    100%{transform:rotate(360deg)}
  }
  .logo-circle{
    width:300px;
    height:300px;
    border-radius:50%;
    padding:10px;
    background:linear-gradient(135deg,#a855f7,#22d3ee,#f472b6,#a855f7);
    background-size:300% 300%;
    animation:gradienteLogo 4s ease infinite;
    box-shadow:
      0 0 80px rgba(168,85,247,.9),
      0 0 140px rgba(34,211,238,.5),
      inset 0 0 40px rgba(0,0,0,.3);
    position:relative;
    z-index:2;
  }
  @keyframes gradienteLogo{
    0%,100%{background-position:0 50%}
    50%{background-position:100% 50%}
  }
  .logo-circle img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:8px solid rgba(0,0,0,.4);
    background:#000;
  }

  /* 🎬 Título principal */
  .titulo{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:135px;
    font-weight:900;
    line-height:0.95;
    letter-spacing:8px;
    background:linear-gradient(135deg,#a855f7 0%,#22d3ee 35%,#f472b6 70%,#fbbf24 100%);
    background-size:300% 300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    animation:gradienteTexto 4s ease infinite;
    filter:drop-shadow(0 0 40px rgba(168,85,247,.7));
    text-align:center;
    padding:0 20px;
  }
  @keyframes gradienteTexto{
    0%,100%{background-position:0 50%}
    50%{background-position:100% 50%}
  }

  .subtitulo{
    font-size:52px;
    letter-spacing:22px;
    color:#22d3ee;
    font-weight:700;
    margin-top:-10px;
    text-shadow:
      0 0 30px rgba(34,211,238,.9),
      0 0 60px rgba(34,211,238,.5);
    font-family:'Arial Black',Arial,sans-serif;
  }

  /* 💰 Caixa de preço */
  .preco-box{
    position:relative;
    padding:50px 80px;
    border-radius:60px;
    background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 50%,#fbbf24 100%);
    background-size:200% 200%;
    animation:brilhoPreco 3s ease infinite;
    box-shadow:
      0 0 80px rgba(251,191,36,.9),
      0 0 150px rgba(251,191,36,.4),
      inset 0 -10px 20px rgba(0,0,0,.15);
    margin:20px 0;
  }
  @keyframes brilhoPreco{
    0%,100%{background-position:0 50%;box-shadow:0 0 80px rgba(251,191,36,.9),0 0 150px rgba(251,191,36,.4),inset 0 -10px 20px rgba(0,0,0,.15)}
    50%{background-position:100% 50%;box-shadow:0 0 110px rgba(251,191,36,1),0 0 200px rgba(251,191,36,.6),inset 0 -10px 20px rgba(0,0,0,.15)}
  }
  .preco-label{
    font-size:38px;
    letter-spacing:6px;
    color:#000;
    font-weight:900;
    margin-bottom:8px;
  }
  .preco-valor{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:170px;
    font-weight:900;
    color:#000;
    line-height:1;
    letter-spacing:-4px;
    text-shadow:0 6px 0 rgba(0,0,0,.15);
  }
  .preco-info{
    font-size:32px;
    color:#000;
    font-weight:700;
    letter-spacing:4px;
    margin-top:10px;
  }

  /* ✅ Benefícios */
  .beneficios{
    display:flex;
    flex-direction:column;
    gap:22px;
    width:100%;
    margin-top:20px;
  }
  .beneficio{
    display:flex;
    align-items:center;
    gap:30px;
    padding:30px 40px;
    background:rgba(255,255,255,.06);
    border:4px solid rgba(168,85,247,.4);
    border-radius:32px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .beneficio .emoji{
    font-size:70px;
    flex-shrink:0;
    filter:drop-shadow(0 0 15px rgba(251,191,36,.6));
  }
  .beneficio .texto{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:46px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-align:left;
    line-height:1.1;
    text-shadow:0 0 20px rgba(168,85,247,.6);
  }

  /* 📱 CTA WhatsApp */
  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:25px;
    padding:50px 90px;
    margin-top:30px;
    background:linear-gradient(135deg,#25d366 0%,#128C7E 100%);
    border-radius:100px;
    font-family:'Arial Black',Arial,sans-serif;
    font-size:58px;
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    box-shadow:
      0 0 80px rgba(37,211,102,.9),
      0 0 140px rgba(37,211,102,.5),
      inset 0 -6px 0 rgba(0,0,0,.2);
    animation:pulseCTA 2.5s ease-in-out infinite;
    text-shadow:0 3px 6px rgba(0,0,0,.3);
  }
  @keyframes pulseCTA{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }

  /* 🏷️ Selo rodapé */
  .selo{
    font-size:28px;
    letter-spacing:8px;
    color:rgba(255,255,255,.6);
    margin-top:30px;
    font-weight:700;
  }

  /* 📱 Aviso (só aparece no PC pra lembrar de printar) */
  .aviso-print{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    color:#0f0;
    padding:10px 20px;
    border-radius:20px;
    font-size:13px;
    font-family:monospace;
    z-index:999;
    border:1px solid #0f0;
  }
</style>
</head>
